[workspace]
resolver = "2"
members = ["wasm"]

[workspace.package]
version = "0.1.0-rc.7"
edition = "2024"
license = "MIT"
repository = "https://github.com/nberlette/dawm"
homepage = "https://n.berlette.com/dawm"
authors = ["Nicholas Berlette <nick@berlette.com>"]

[workspace.dependencies]
html5ever = "0.38.0"
markup5ever = "0.38.0"
xml5ever = "0.38.0"
tendril = "0.5"
serde = { version = "1.0", features = ["derive", "alloc", "rc"] }
serde_repr = "0.1.20"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "=0.2.114"
js-sys = "=0.3.91"
moos = { version = "0.3", features = ["derive_more"] }
derive_more = { version = "2.1", features = [
  "as_ref",
  "constructor",
  "debug",
  "deref",
  "deref_mut",
  "display",
  "error",
  "from",
  "from_str",
  "index",
  "index_mut",
  "into",
  "into_iterator",
  "is_variant",
  "try_into",
  "try_from",
  "try_unwrap",
] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"
